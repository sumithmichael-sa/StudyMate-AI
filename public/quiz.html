
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Generator | StudyMate AI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .quiz-container {
            max-width: 850px;
            margin: 50px auto;
            padding: 30px;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .quiz-form, .quiz-area, .result-area {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            color: #222;
        }

        .quiz-form label {
            display: block;
            margin: 15px 0 7px;
            font-weight: 600;
        }

        .quiz-form input, .quiz-form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .quiz-btn {
            margin-top: 22px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #5b4bdb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .quiz-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .quiz-area, .result-area {
            margin-top: 25px;
        }

        .question-card {
            padding: 18px 0;
            border-bottom: 1px solid #eee;
        }

        .question-card h3 {
            margin-bottom: 15px;
        }

        .option {
            display: block;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
        }

        .option:hover {
            background: #f3f1ff;
        }

        .option input {
            margin-right: 10px;
        }

        .correct-answer {
            background: #e6f7e9;
            border-color: #36a653;
        }

        .wrong-answer {
            background: #fdeaea;
            border-color: #d9534f;
        }

        .feedback {
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }

        #quizStatus {
            margin-top: 15px;
            color: #555;
        }

        @media (max-width: 600px) {
            .quiz-container {
                padding: 15px;
                margin: 25px auto;
            }

            .quiz-form, .quiz-area, .result-area {
                padding: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="quiz-header">
            <h1>AI Quiz Generator</h1>
            <p>Generate personalised practice quizzes with StudyMate AI.</p>
            <p><a href="index.html">← Back to Home</a></p>
        </div>

        <div class="quiz-form" id="quizForm">
            <h2>Create Your Quiz</h2>

            <label for="quizSubject">Subject</label>
            <select id="quizSubject">
                <option value="Computer Science">Computer Science</option>
                <option value="Cloud Computing">Cloud Computing</option>
                <option value="Java Programming">Java Programming</option>
                <option value="Data Structures">Data Structures</option>
                <option value="Computer Networks">Computer Networks</option>
                <option value="Other">Other</option>
            </select>

            <label for="quizTopic">Topic</label>
            <input type="text" id="quizTopic" placeholder="Example: Cloud Deployment Models" required>

            <label for="questionCount">Number of Questions</label>
            <select id="questionCount">
                <option value="5">5 Questions</option>
                <option value="10">10 Questions</option>
                <option value="15">15 Questions</option>
            </select>

            <label for="difficulty">Difficulty</label>
            <select id="difficulty">
                <option value="Easy">Easy</option>
                <option value="Medium" selected>Medium</option>
                <option value="Hard">Hard</option>
            </select>

            <button class="quiz-btn" id="generateQuizBtn" type="button">
                Generate Quiz
            </button>

            <p id="quizStatus" role="status"></p>
        </div>

        <div class="quiz-area hidden" id="quizArea">
            <h2 id="quizTitle">Your Quiz</h2>
            <div id="questionsContainer"></div>
            <button class="quiz-btn" id="submitQuizBtn" type="button">
                Submit Quiz
            </button>
        </div>

        <div class="result-area hidden" id="resultArea">
            <h2>Quiz Results</h2>
            <h3 id="scoreText"></h3>
            <div id="reviewContainer"></div>
            <button class="quiz-btn" id="retryBtn" type="button">
                Create Another Quiz
            </button>
        </div>
    </div>

    <script src="js/quiz.js"></script>
</body>
</html>
